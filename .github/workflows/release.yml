# Builds a Linux zip and a Windows Squirrel installer and publishes them as a
# GitHub release. A push to main releases automatically when package.json has
# a version with no v<version> tag yet (the release creates that tag); a merge
# without a version bump does nothing. Pushing a tag like v0.2.0 also
# releases, the tag setting the version. Running it by hand, or on a PR that
# touches packaging, only builds and keeps the artifacts.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - electron.vite.config.ts
      - scripts/fetch-node.mjs
  workflow_dispatch:

permissions:
  contents: write

# All pushes (main and tags) share one queue and are never cancelled, so a
# run's tag check sees what an earlier run published. Newer PR pushes cancel
# older builds of the same PR.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this run publishes, and under which tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            tag="v$(node -p "require('./package.json').version")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            # --exit-code: 0 = tag exists, 2 = confirmed missing; anything
            # else (network, auth) fails the job rather than publishing.
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || rc=$?
            case $rc in
              0) echo "$tag already released; nothing to do."
                 echo "release=false" >> "$GITHUB_OUTPUT" ;;
              2) echo "release=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Tag lookup for $tag failed (git exit $rc)"; exit 1 ;;
            esac
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    # On main, build only when there is a new version to release.
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            target: --linux
            files: |
              release/*.zip
          - os: windows-latest
            name: windows
            target: --win
            files: |
              release/squirrel-windows/*.exe
              release/squirrel-windows/*.nupkg
              release/squirrel-windows/RELEASES
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json uses npm 12's allowScripts to gate install scripts.
      - run: npm install -g npm@12

      - run: npm ci

      - name: Take the version from the tag
        if: needs.version.outputs.release == 'true'
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      # uiohook's X11 code needs a display, even just to load.
      - if: matrix.name == 'linux'
        run: npm run typecheck && xvfb-run -a npm test

      - run: npm run build

      # Downloads the pinned Node binary that runs the STT worker (host
      # platform/arch is correct on both runners); must precede electron-builder.
      - run: node scripts/fetch-node.mjs

      # Targets and artifact names live in package.json ("build").
      - run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: chirp-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      # A hand-pushed tag may already have its release; never overwrite it.
      - id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "$TAG is already published; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "release not found" <<< "$out"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release lookup for $TAG failed: $out"
            exit 1
          fi

      - if: steps.published.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - if: steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          # On main this creates the tag at the merged commit. Tags made with
          # GITHUB_TOKEN don't trigger workflows, so this doesn't run twice.
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
